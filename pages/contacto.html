<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="HTML, CSS, SCSS, META, PS5, VENTAS, JUEGOS, CONSOLAS, PRODUCTOS, SERVICIOS, UBICACION, MAPS, LUGAR, ACERCA, CONTACTO, FORMULARIO">
  <meta name="description" content="En esta seccion de contacto van a poder contactar con nosotros por cualquier consulta o inconveniente">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Contrail+One&family=Kanit:ital,wght@1,900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="shortcut icon" href="../img/icono.png">
  <title>Contactenos</title>
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark lista">
      <div class="container-fluid">
        <a class="navbar-brand" href="../index.html">Juegos y Consolas</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/productos.html">Productos</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/acerca.html">Acerca de nosotros</a></li>
          <li class="nav-item"><a class="nav-link" href="../pages/servicios.html">Servicios</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="../pages/contacto.html">Contactenos</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="contenido">
    <h2>Nuestro contacto</h2>

    <div class="datos-contacto">
      <h3>WhatApp: 1133731648</h3>
      <h3>E-Mail: contacto@juegosyconsolas.com</h3>
    </div>

    <div class="fondo_contacto">
      <form>
        <fieldset>
          <legend>Su Información</legend>
          <div class="campo">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" autocomplete="name" required>
          </div>
          <div class="campo">
            <label for="email">E-mail:</label>
            <input type="email" id="email" autocomplete="email" required>
          </div>
          <div class="campo">
            <label for="telefono">Telefono:</label>
            <input type="tel" id="telefono" autocomplete="tel" required>
          </div>
          <div class="campo">
            <textarea placeholder="Dejanos tu consulta" aria-label="Consulta" rows="4" required></textarea>
          </div>
          <div class="botones">
            <input class="boton" type="submit" value="Enviar">
            <input class="boton" type="reset" value="Borrar">
          </div>
        </fieldset>
      </form>
    </div>
  </main>

  <footer>Todos los derechos reservados. Maximiliano Berenguer</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
